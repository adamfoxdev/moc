name: uptime

# A free uptime monitor: every 15 minutes, ask each live site whether it is up and serving the right brand.
# A failure sends GitHub's usual "workflow failed" email to people watching the repository.
# (GitHub may delay scheduled runs, and pauses them after 60 days without repository activity.)
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node platform/scripts/check-sites.mjs
